<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelenePlan API Documentation v1.0.0</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%236366f1'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    redoc {
      display: block;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js"></script>
</head>
<body>
  <div id="redoc-container"></div>
  <script>
    Redoc.init('../../contracts/openapi/selene-v1.yaml', {
      theme: {
        colors: {
          primary: {
            main: '#6366f1'
          },
          success: {
            main: '#10b981'
          },
          warning: {
            main: '#f59e0b'
          },
          error: {
            main: '#ef4444'
          },
          text: {
            primary: '#1e293b',
            secondary: '#64748b'
          },
          http: {
            get: '#2563eb',
            post: '#16a34a',
            put: '#d97706',
            options: '#475569'
          }
        },
        typography: {
          fontFamily: 'Inter, sans-serif',
          headings: {
            fontFamily: 'Inter, sans-serif',
            fontWeight: '600'
          }
        },
        sidebar: {
          backgroundColor: '#0f172a',
          textColor: '#cbd5e1'
        }
      },
      expandResponses: '200,201',
      requiredPropsFirst: true,
      sortPropsAlphabetically: true
    }, document.getElementById('redoc-container'));
  </script>
</body>
</html>
