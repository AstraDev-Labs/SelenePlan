# Kong declarative config (DB-less). Starter skeleton.
#
# PHASE 0 DECISION REQUIRED (record in services/gateway/DECISIONS.md):
# Kong OSS ships a static-key `jwt` plugin; full OIDC/JWKS validation needs an
# enterprise or community plugin. Options:
#   A) Kong `jwt` plugin with the Keycloak realm public key synced by a script
#      (manual rotation handling).
#   B) Switch the gateway to Envoy with `jwt_authn` and remote JWKS (automatic
#      key rotation). Preferred if JWKS rotation matters.
# Either way every service ALSO validates the JWT itself (defense in depth).
_format_version: "3.0"

services:
  - name: project-service
    url: http://project-service:8101
    routes:
      - name: project-service-routes
        strip_path: false
        paths:
          - /v1/projects
          - /v1/scenarios
          - /v1/runs
          - /v1/plans

  - name: ingestion-service
    url: http://ingestion-service:8102
    routes:
      - name: ingestion-service-routes
        strip_path: false
        paths:
          - /v1/datasets

  - name: planner-service
    url: http://planner-service:8107
    routes:
      - name: planner-service-routes
        strip_path: false
        paths:
          - /v1/planner

  - name: report-service
    url: http://report-service:8108
    routes:
      - name: report-service-routes
        strip_path: false
        paths:
          - /v1/reports

  - name: audit-service
    url: http://audit-service:8109
    routes:
      - name: audit-service-routes
        strip_path: false
        paths:
          - /v1/audit

  - name: signing-service
    url: http://signing-service:8110
    routes:
      - name: signing-service-routes
        strip_path: false
        paths:
          - /v1/verify

plugins:
  - name: rate-limiting
    config:
      minute: 120
      policy: local
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
  - name: cors
    config:
      origins:
        - http://localhost:5173
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, Idempotency-Key]
      credentials: false
      max_age: 3600
