admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: gateway_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                generate_request_id: true
                tracing: {}
                http_filters:
                  # 1. Request body size limiting (10 MB buffer limit -> 413)
                  - name: envoy.filters.http.buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.buffer.v3.Buffer
                      max_request_bytes: 10485760

                  # 2. Rate limiting (local)
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      status:
                        code: 429
                      token_bucket:
                        max_tokens: 120
                        tokens_per_fill: 120
                        fill_interval: 60s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: "Retry-After"
                            value: "60"

                  # 3. JWT Authentication against Keycloak JWKS
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: http://localhost:8081/realms/selene
                          audiences:
                            - selene-api
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/selene/protocol/openid-connect/certs
                              cluster: keycloak_cluster
                              timeout: 5s
                            cache_duration: 300s
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          forward: true
                      rules:
                        - match:
                            prefix: /v1/
                          requires:
                            provider_name: keycloak
                        - match:
                            prefix: /tiles
                          requires:
                            provider_name: keycloak

                  # 4. CORS
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                  # 5. Router
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                route_config:
                  name: selene_routes
                  virtual_hosts:
                    - name: selene_services
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - exact: http://localhost:3000
                          - exact: http://localhost:5173
                        allow_methods: GET, PUT, POST, DELETE, PATCH, OPTIONS
                        allow_headers: Authorization, Content-Type, Idempotency-Key, X-Request-Id, traceparent
                        max_age: "3600"
                      routes:
                        # Hello Service (Phase 0 validation upstream)
                        - match:
                            prefix: /v1/hello
                          route:
                            cluster: hello_service_cluster
                            timeout: 15s

                        # Project Service
                        - match:
                            prefix: /v1/projects
                          route:
                            cluster: project_service_cluster
                            timeout: 30s
                        - match:
                            prefix: /v1/scenarios
                          route:
                            cluster: project_service_cluster
                            timeout: 30s
                        - match:
                            prefix: /v1/runs
                          route:
                            cluster: project_service_cluster
                            timeout: 30s
                        - match:
                            prefix: /v1/plans
                          route:
                            cluster: project_service_cluster
                            timeout: 30s

                        # Ingestion Service
                        - match:
                            prefix: /v1/datasets
                          route:
                            cluster: ingestion_service_cluster
                            timeout: 60s

                        # Planner Service
                        - match:
                            prefix: /v1/planner
                          route:
                            cluster: planner_service_cluster
                            timeout: 60s

                        # Report Service
                        - match:
                            prefix: /v1/reports
                          route:
                            cluster: report_service_cluster
                            timeout: 30s

                        # Audit Service
                        - match:
                            prefix: /v1/audit
                          route:
                            cluster: audit_service_cluster
                            timeout: 15s

                        # Signing Service
                        - match:
                            prefix: /v1/verify
                          route:
                            cluster: signing_service_cluster
                            timeout: 15s

                        # TiTiler
                        - match:
                            prefix: /tiles
                          route:
                            cluster: titiler_cluster
                            timeout: 30s

  clusters:
    - name: keycloak_cluster
      connect_timeout: 3s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: keycloak_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: keycloak
                      port_value: 8080

    - name: hello_service_cluster
      connect_timeout: 3s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: hello_service_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: hello-service
                      port_value: 8100

    - name: project_service_cluster
      connect_timeout: 3s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: project_service_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: project-service
                      port_value: 8101

    - name: ingestion_service_cluster
      connect_timeout: 3s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: ingestion_service_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ingestion-service
                      port_value: 8102

    - name: planner_service_cluster
      connect_timeout: 3s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: planner_service_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: planner-service
                      port_value: 8107

    - name: report_service_cluster
      connect_timeout: 3s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: report_service_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: report-service
                      port_value: 8108

    - name: audit_service_cluster
      connect_timeout: 3s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: audit_service_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: audit-service
                      port_value: 8109

    - name: signing_service_cluster
      connect_timeout: 3s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: signing_service_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: signing-service
                      port_value: 8110

    - name: titiler_cluster
      connect_timeout: 3s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: titiler_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: titiler
                      port_value: 8000
