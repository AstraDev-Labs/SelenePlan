apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: terrain-worker-scaler
  namespace: "{{ .Values.global.namespace }}"
spec:
  scaleTargetRef:
    name: terrain-service
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 60
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: terrain-processors
        topic: selene.analysis.terrain
        lagThreshold: "10"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: illumination-worker-scaler
  namespace: "{{ .Values.global.namespace }}"
spec:
  scaleTargetRef:
    name: illumination-service
  minReplicaCount: 2
  maxReplicaCount: 12
  cooldownPeriod: 60
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: illumination-processors
        topic: selene.analysis.illumination
        lagThreshold: "5"
