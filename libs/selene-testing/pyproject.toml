[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selene-testing"
version = "0.1.0"
description = "SelenePlan test utilities: synthetic terrain generators with analytic answers (planes, cones, craters, ridges)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "selene-geo",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
selene_testing = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "EXE002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
