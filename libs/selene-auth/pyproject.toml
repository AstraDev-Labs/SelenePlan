[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selene-auth"
version = "0.1.0"
description = "SelenePlan JWT verification, pinned algorithms, RBAC, and fail-closed OPA client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",
    "pydantic>=2.8.0",
    "fastapi>=0.112.0",
    "httpx>=0.27.0",
    "starlette>=0.38.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
selene_auth = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
