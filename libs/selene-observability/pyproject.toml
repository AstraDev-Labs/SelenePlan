[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selene-observability"
version = "0.1.0"
description = "SelenePlan OpenTelemetry, JSON structured logging, Prometheus metrics, and health routers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp>=1.26.0",
    "prometheus-client>=0.20.0",
    "fastapi>=0.112.0",
    "starlette>=0.38.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
selene_observability = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
