openapi: 3.1.0
info:
  title: SelenePlan API
  version: 1.0.0
  description: >
    Contract skeleton for the public API behind the gateway. Each service must
    implement its slice and keep its generated OpenAPI consistent with this file.
    Add detail as endpoints are implemented; keep changes additive within /v1.
servers:
  - url: http://localhost:8080
    description: Local gateway
security:
  - bearerAuth: []
tags:
  - name: projects
  - name: runs
  - name: datasets
  - name: products
  - name: plans
  - name: planner
  - name: integrity
  - name: reports
paths:
  /v1/projects:
    post:
      tags: [projects]
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/projects/{projectId}:
    get:
      tags: [projects]
      summary: Get a project
      operationId: getProject
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/scenarios/{scenarioId}/runs:
    post:
      tags: [runs]
      summary: Start a pipeline run
      operationId: startRun
      parameters:
        - { name: scenarioId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202':
          description: Accepted
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/runs/{runId}:
    get:
      tags: [runs]
      summary: Get run state and steps
      operationId: getRun
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
  /v1/datasets:
    post:
      tags: [datasets]
      summary: Register or ingest a dataset
      operationId: registerDataset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DatasetCreate' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dataset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/datasets/upload:
    post:
      tags: [datasets]
      summary: Upload a dataset file
      operationId: uploadDataset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name, kind, license]
              properties:
                file: { type: string, format: binary }
                name: { type: string }
                kind: { type: string, enum: [dem, orthoimage, ephemeris] }
                license: { type: string }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dataset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/datasets/{datasetId}:
    get:
      tags: [datasets]
      summary: Get dataset metadata
      operationId: getDataset
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/datasets/{datasetId}/versions:
    get:
      tags: [datasets]
      summary: List versions of a dataset
      operationId: listDatasetVersions
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DatasetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/datasets/{datasetId}/versions/{version}:
    get:
      tags: [datasets]
      summary: Get dataset version detail with manifest
      operationId: getDatasetVersion
      parameters:
        - { name: datasetId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetVersion' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/sources:
    get:
      tags: [datasets]
      summary: List allowed sources
      operationId: listAllowedSources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AllowedSource' }
  /v1/products/{id}:
    get:
      tags: [products]
      summary: Product metadata and raster stats
      operationId: getProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Product metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductMetadataResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/products/{id}/stats:
    get:
      tags: [products]
      summary: Fast quantile summary for product
      operationId: getProductStats
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fast stats summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductStatsResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/terrain/analyze:
    post:
      tags: [terrain]
      summary: Trigger terrain analysis pipeline
      operationId: analyzeTerrain
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TerrainAnalyzeRequest' }
      responses:
        '200':
          description: Terrain analysis products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerrainAnalyzeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/products/{productId}/slice:
    get:
      tags: [products]
      summary: Time slice of an illumination or visibility product
      operationId: getProductSlice
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: t, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Tile template or COG window reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SliceRef' }
  /v1/plans/{planId}/versions/{version}/decision:
    post:
      tags: [plans]
      summary: Approve or reject a plan version
      operationId: decidePlan
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200':
          description: Decision recorded
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/planner/routes/{routeId}:
    get:
      tags: [planner]
      summary: Route with waypoints and explanation
      operationId: getRoute
      parameters:
        - { name: routeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Route' }
  /v1/verify:
    post:
      tags: [integrity]
      summary: Verify a signed plan bundle
      operationId: verifyBundle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignedBundle' }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResult' }
  /v1/audit/integrity:
    get:
      tags: [integrity]
      summary: Verify the audit hash chain
      operationId: verifyAuditChain
      responses:
        '200':
          description: Chain status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChainStatus' }
  /v1/artifacts/{id}:
    get:
      tags: [provenance]
      summary: Get artifact metadata
      operationId: getArtifact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/lineage/{id}:
    get:
      tags: [provenance]
      summary: Get artifact lineage graph
      operationId: getLineage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [up, down], default: up } }
        - { name: depth, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: Lineage DAG
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineageDAG' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/lineage/{id}/replay-spec:
    get:
      tags: [provenance]
      summary: Get replay recipe for an artifact
      operationId: getReplaySpec
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Replay specification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplaySpec' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/v1/artifacts:
    post:
      tags: [provenance]
      summary: Register an artifact and lineage
      operationId: registerArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactRegisterRequest' }
      responses:
        '201':
          description: Artifact registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/verify-artifact:
    post:
      tags: [provenance]
      summary: Verify artifact integrity against storage and registry
      operationId: verifyArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyArtifactRequest' }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactVerification' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code: { type: string }
            message: { type: string }
            trace_id: { type: string }
            details: { type: array, items: { type: object } }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectCreate'
        - type: object
          required: [id, org_id, created_at]
          properties:
            id: { type: string, format: uuid }
            org_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    Run:
      type: object
      required: [id, scenario_id, state]
      properties:
        id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        steps:
          type: array
          items:
            type: object
            properties:
              step: { type: string, enum: [terrain, hazard, illumination, comms, plan] }
              state: { type: string }
              product_id: { type: [string, 'null'], format: uuid }
        failure_reason: { type: [string, 'null'] }
    DatasetCreate:
      type: object
      required: [name, kind, source, license]
      properties:
        name: { type: string }
        kind: { type: string, enum: [dem, orthoimage, ephemeris] }
        source: { type: string, description: 'Allowlisted source identifier, not an arbitrary URL' }
        license: { type: string }
        expected_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Dataset:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, ingesting, registered, failed] }
    DatasetDetail:
      type: object
      required: [id, org_id, project_id, name, kind, source_name, source_url, license, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [dem, orthoimage, ephemeris] }
        source_name: { type: string }
        source_url: { type: string }
        license: { type: string }
        terms_note: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    DatasetVersion:
      type: object
      required: [id, dataset_id, version, storage_uri, crs_wkt, resolution_m, bbox, size_bytes, sha256, status, manifest]
      properties:
        id: { type: string, format: uuid }
        dataset_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        storage_uri: { type: string }
        crs_wkt: { type: string }
        resolution_m: { type: number }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        size_bytes: { type: integer }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        status: { type: string, enum: [queued, ingesting, registered, failed] }
        manifest: { type: object }
    AllowedSource:
      type: object
      required: [id, name, host, path_prefix, license, max_size_bytes]
      properties:
        id: { type: string }
        name: { type: string }
        host: { type: string }
        path_prefix: { type: string }
        license: { type: string }
        terms_note: { type: string }
        max_size_bytes: { type: integer }
    SliceRef:
      type: object
      required: [product_id, t]
      properties:
        product_id: { type: string, format: uuid }
        t: { type: string, format: date-time }
        tile_url_template: { type: string }
        cog_url: { type: string }
    Decision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        comment: { type: string, maxLength: 2000 }
    Route:
      type: object
      required: [id, waypoints]
      properties:
        id: { type: string, format: uuid }
        waypoints:
          type: array
          items:
            type: object
            required: [t, x_m, y_m]
            properties:
              t: { type: string, format: date-time }
              x_m: { type: number }
              y_m: { type: number }
              sun_elev_deg: { type: number }
              earth_visible: { type: boolean }
              battery_wh: { type: number }
        metrics: { type: object }
        explanation: { type: object }
    SignedBundle:
      type: object
      required: [plan, signature]
      properties:
        plan: { type: object }
        signature: { type: object }
    VerifyResult:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        reason: { type: string }
        key_id: { type: string }
        payload_sha256: { type: string }
    ChainStatus:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        checked_from_seq: { type: integer }
        checked_to_seq: { type: integer }
        first_break_seq: { type: [integer, 'null'] }
    ArtifactDetail:
      type: object
      required: [id, org_id, project_id, kind, uri, sha256, size_bytes, created_by_service, created_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind: { type: string }
        uri: { type: string }
        sha256: { type: string }
        size_bytes: { type: integer }
        created_by_service: { type: string }
        metadata: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
    ArtifactRegisterRequest:
      type: object
      required: [artifact_id, org_id, project_id, kind, uri, sha256, size_bytes, created_by_service]
      properties:
        artifact_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        kind: { type: string }
        uri: { type: string }
        sha256: { type: string }
        size_bytes: { type: integer }
        created_by_service: { type: string }
        metadata: { type: object, nullable: true }
        manifest: { type: object, nullable: true }
        parent_edges:
          type: array
          items: { type: object }
    LineageDAG:
      type: object
      required: [root_artifact_id, direction, depth_queried, nodes, edges]
      properties:
        root_artifact_id: { type: string, format: uuid }
        direction: { type: string }
        depth_queried: { type: integer }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/ArtifactDetail' }
        edges:
          type: array
          items:
            type: object
            required: [id, child_artifact_id, parent_artifact_id, relation]
            properties:
              id: { type: string, format: uuid }
              child_artifact_id: { type: string, format: uuid }
              parent_artifact_id: { type: string, format: uuid }
              relation: { type: string }
              params_hash: { type: string, nullable: true }
    ReplaySpec:
      type: object
      required: [schema, artifact_id, kind, sha256, uri, created_by_service, lineage_dag]
      properties:
        schema: { type: string }
        artifact_id: { type: string, format: uuid }
        kind: { type: string }
        sha256: { type: string }
        uri: { type: string }
        created_by_service: { type: string }
        manifest: { type: object, nullable: true }
        source_inputs:
          type: array
          items: { type: object }
        lineage_dag: { type: object }
        parameters: { type: object, nullable: true }
    VerifyArtifactRequest:
      type: object
      required: [artifact_id]
      properties:
        artifact_id: { type: string, format: uuid }
        expected_sha256: { type: string, nullable: true }
        read_storage: { type: boolean, default: true }
    ArtifactVerification:
      type: object
      required: [valid, artifact_id]
      properties:
        valid: { type: boolean }
        artifact_id: { type: string, format: uuid }
        registered_sha256: { type: string, nullable: true }
        actual_sha256: { type: string, nullable: true }
        storage_uri: { type: string, nullable: true }
        manifest_valid: { type: boolean, nullable: true }
        reason: { type: string, nullable: true }
    ProductMetadataResponse:
      type: object
      required: [product_id, project_id, product_type, uri, sha256, shape, resolution_m, crs, stats]
      properties:
        product_id: { type: string, format: uuid }
        project_id: { type: string }
        source_dataset_id: { type: string }
        product_type: { type: string, enum: [slope, aspect, roughness, hazard] }
        uri: { type: string }
        sha256: { type: string }
        shape:
          type: array
          items: { type: integer }
        resolution_m: { type: number }
        crs: { type: string }
        stats: { $ref: '#/components/schemas/ProductStatsResponse' }
        manifest: { type: object }
    ProductStatsResponse:
      type: object
      required: [valid_pixels, total_pixels, valid_fraction]
      properties:
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        mean: { type: number, nullable: true }
        std: { type: number, nullable: true }
        p50: { type: number, nullable: true }
        p90: { type: number, nullable: true }
        p99: { type: number, nullable: true }
        hazard_fraction: { type: number, nullable: true }
        safe_fraction: { type: number, nullable: true }
        valid_pixels: { type: integer }
        total_pixels: { type: integer }
        valid_fraction: { type: number }
    TerrainAnalyzeRequest:
      type: object
      required: [project_id, dem_uri]
      properties:
        project_id: { type: string }
        source_dataset_id: { type: string, default: "dem" }
        dem_uri: { type: string }
        resolution_m: { type: number, default: 20.0 }
        crs: { type: string, default: "IAU_2015:30100" }
        max_slope_deg: { type: number, default: 15.0 }
        max_roughness_m: { type: number, default: 0.35 }
        tile_size: { type: integer, default: 512 }
        halo: { type: integer, default: 1 }
    TerrainAnalyzeResponse:
      type: object
      required: [status, project_id, products]
      properties:
        status: { type: string }
        project_id: { type: string }
        source_dataset_id: { type: string }
        products:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProductMetadataResponse'
        errors:
          type: array
          items: { type: string }
