name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --verbose --redact

  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - project-service
          - ingestion-service
          - terrain-service
          - hazard-ml-service
          - illumination-service
          - comms-service
          - planner-service
          - report-service
          - audit-service
          - signing-service
          - provenance-service
    steps:
      - uses: actions/checkout@v4
      - name: Skip if service not started yet
        id: exists
        run: |
          if [ -f "services/${{ matrix.service }}/pyproject.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.exists.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.exists.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/selene-auth -e libs/selene-events -e libs/selene-observability -e libs/selene-geo -e libs/selene-horizon -e libs/selene-testing
          pip install -e "services/${{ matrix.service }}[dev]"
      - name: Lint
        if: steps.exists.outputs.present == 'true'
        run: ruff check "services/${{ matrix.service }}" --config pyproject.toml && ruff format --check "services/${{ matrix.service }}" --config pyproject.toml
      - name: Type check
        if: steps.exists.outputs.present == 'true'
        run: mypy --config-file pyproject.toml "services/${{ matrix.service }}/src"
      - name: Tests
        if: steps.exists.outputs.present == 'true'
        run: pytest "services/${{ matrix.service }}/tests" -q --maxfail=1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if web not started yet
        id: exists
        run: |
          if [ -f services/web/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.exists.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - name: Install, lint, typecheck, test, audit
        if: steps.exists.outputs.present == 'true'
        working-directory: services/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm audit --audit-level=high --omit=dev

  contracts-and-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint OpenAPI
        run: npx --yes @stoplight/spectral-cli lint contracts/openapi/selene-v1.yaml --fail-severity=error || true
      - name: Validate event envelope schema is valid JSON
        run: python3 -c "import json,sys; json.load(open('contracts/events/envelope.schema.json'))"
      - name: Validate compose file
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.yml --env-file infra/.env config -q
      - name: OPA tests (if policies exist)
        run: |
          if [ -d policies ] && ls policies/*.rego >/dev/null 2>&1; then
            curl -sSL -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
            chmod +x opa
            ./opa test policies -v
          else
            echo "No policies yet"
          fi

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/default --error --severity ERROR .
      - name: Trivy filesystem scan
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 .
      - name: SBOM (Syft)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json=sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
