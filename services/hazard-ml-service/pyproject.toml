[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hazard-ml-service"
version = "0.1.0"
description = "Machine learning crater and boulder hazard detection, model registry with signing, and hazard fusion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "pillow>=10.0.0",
    "scipy>=1.12.0",
    "redis>=5.0.0",
    "selene-auth>=0.1.0",
    "selene-events>=0.1.0",
    "selene-observability>=0.1.0",
    "selene-geo>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
