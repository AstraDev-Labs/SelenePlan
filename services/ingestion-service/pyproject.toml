[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingestion-service"
version = "0.1.0"
description = "SelenePlan Ingestion Service: Egress-controlled dataset registration and COG ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "aiokafka>=0.11.0",
    "boto3>=1.35.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "selene-auth",
    "selene-events",
    "selene-observability",
    "selene-geo",
    "selene-testing",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-boto3>=1.35.0",
    "types-pyyaml>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",
    "EXE002",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../libs/selene-auth/src",
    "../../libs/selene-events/src",
    "../../libs/selene-observability/src",
    "../../libs/selene-geo/src",
    "../../libs/selene-testing/src",
]
