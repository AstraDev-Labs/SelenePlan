[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-service"
version = "0.1.0"
description = "System of record and pipeline orchestrator for SelenePlan"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
    "selene-events",
    "selene-auth",
    "selene-observability",
]

[tool.hatch.build.targets.wheel]
packages = ["src/project_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
