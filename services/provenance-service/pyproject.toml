[project]
name = "provenance-service"
version = "0.1.0"
description = "SelenePlan Provenance & Lineage Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "selene-auth",
    "selene-events",
    "selene-observability",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "src",
    "../../libs/selene-auth/src",
    "../../libs/selene-events/src",
    "../../libs/selene-observability/src",
    "../../libs/selene-geo/src",
    "../../libs/selene-testing/src",
]
