[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "illumination-service"
version = "0.1.0"
description = "Time-varying solar illumination and shadow engine for lunar south pole exploration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "numba>=0.59.0",
    "spiceypy>=8.3.0",
    "zarr>=2.16.0",
    "redis>=5.0.0",
    "selene-auth>=0.1.0",
    "selene-events>=0.1.0",
    "selene-observability>=0.1.0",
    "selene-geo>=0.1.0",
    "selene-horizon>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
