[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "report-service"
version = "0.1.0"
description = "Mission report generation and GeoJSON/CSV export service for SelenePlan"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    "selene-events",
    "selene-auth",
    "selene-observability",
]

[tool.hatch.build.targets.wheel]
packages = ["src/report_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
