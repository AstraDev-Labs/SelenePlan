[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends in function defaults
    "EXE002",  # Executable without shebang (cross-platform Windows NTFS mount artifact)
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs"]
