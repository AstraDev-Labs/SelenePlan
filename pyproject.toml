[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",    # FastAPI Depends in function defaults
    "EXE002",  # Executable without shebang (cross-platform Windows NTFS mount artifact)
    "E402",    # Module level import not at top of file (sys.path manipulation for standalone tools/scripts)
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = [
    "libs/selene-auth/src",
    "libs/selene-events/src",
    "libs/selene-observability/src",
    "libs/selene-geo/src",
    "libs/selene-testing/src",
    "services/hello-service/src",
    "services/audit-service/src",
    "services/ingestion-service/src",
    "services/provenance-service/src",
    "services/terrain-service/src",
    "services/illumination-service/src",
    "services/comms-service/src",
    "services/hazard-ml-service/src",
    "services/planner-service/src",
    "services/project-service/src",
    "services/signing-service/src",
    "services/report-service/src",
]

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "yaml.*",
    "scipy.*",
    "onnxruntime.*",
    "cv2.*",
    "zarr.*",
    "spiceypy.*",
    "selene_horizon.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]
pythonpath = [
    ".",
    "libs/selene-auth/src",
    "libs/selene-events/src",
    "libs/selene-observability/src",
    "libs/selene-geo/src",
    "libs/selene-testing/src",
    "services/hello-service/src",
    "services/audit-service/src",
    "services/ingestion-service/src",
    "services/provenance-service/src",
    "services/terrain-service/src",
    "services/illumination-service/src",
    "services/comms-service/src",
    "services/hazard-ml-service/src",
    "services/planner-service/src",
    "services/project-service/src",
    "services/signing-service/src",
    "services/report-service/src",
]
markers = [
    "integration: marks tests as integration tests (requires live external services)",
]

[tool.coverage.run]
source = [
    "libs/selene-auth/src",
    "libs/selene-events/src",
    "libs/selene-observability/src",
    "libs/selene-geo/src",
    "libs/selene-testing/src",
    "services/hello-service/src",
    "services/audit-service/src",
    "services/ingestion-service/src",
    "services/provenance-service/src",
    "services/terrain-service/src",
]
omit = [
    "*/tests/*",
]
